name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (supply chain); Dependabot proposes updates.
env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile # lockfile committed; install scripts stay blocked (pnpm-workspace.yaml)
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit:high # fails on any high finding except the reviewed ones in pnpm-workspace.yaml
      - run: pnpm scan # forbidden wording and secrets in the repository
      - run: pnpm sbom:generate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: sbom/ }

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @symbiomed/web exec playwright install --with-deps chromium
      - run: pnpm e2e # mock mode: flows, axe, Lighthouse, CSP, cookies, forbidden words

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d
      - name: Wait for HAPI and Keycloak
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8090/fhir/metadata -o /dev/null && curl -sf http://127.0.0.1:8180/realms/symbiomed/.well-known/openid-configuration -o /dev/null && exit 0
            sleep 5
          done
          exit 1
      - run: pnpm seed
      - run: pnpm test:hapi # contract tests on HAPI and real Keycloak logins
      - run: pnpm --filter @symbiomed/web exec playwright install --with-deps chromium
      - run: pnpm e2e:prod # production build: Keycloak sign-in, strict CSP
      - run: pnpm --filter @symbiomed/mobile export
      - run: pnpm scan:bundles # shipped web and mobile bundles
